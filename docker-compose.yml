version: '3.8'

services:
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - address-matching-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - address-matching-network
    command: ["python", "-m", "src.pipeline.orchestrator"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - address-matching-network
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--reload"]
    
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - address-matching-network
    restart: unless-stopped

networks:
  address-matching-network:
    driver: bridge

volumes:
  postgres_data: 