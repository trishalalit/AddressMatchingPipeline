version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: addruser
      POSTGRES_PASSWORD: addrpass
      POSTGRES_DB: addrdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U addruser -d addrdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://addruser:addrpass@postgres:5432/addrdb
      PYTHONPATH: /app
    command: ["python", "-m", "src.pipeline.orchestrator"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://addruser:addrpass@postgres:5432/addrdb
      PYTHONPATH: /app
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--reload"]

volumes:
  postgres_data:
